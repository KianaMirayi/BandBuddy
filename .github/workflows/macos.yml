name: macOS CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify native runner architecture
        shell: bash
        run: test "$(uname -m)" = "arm64"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.9.0'
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install HQ6 test dependencies
        run: python -m pip install --disable-pip-version-check -r python/guitar_separator_hq/requirements-test.txt

      - name: Fetch verified native desktop tools
        run: pnpm tools:fetch

      - name: Validate and test
        run: |
          python -m compileall -q python/worker python/guitar_separator_hq
          pnpm test:model-bundle
          pnpm test:guitar-hq
          pnpm test

      - name: Package unsigned macOS builds
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm package:mac

      - name: Verify packaged application and native tools
        shell: bash
        run: |
          app_path="$(find release-macos -maxdepth 2 -type d -name BandBuddy.app | head -n 1)"
          test -n "$app_path"
          test -x "$app_path/Contents/MacOS/BandBuddy"
          test -x "$app_path/Contents/Resources/bin/uv"
          test -x "$app_path/Contents/Resources/bin/ffmpeg"
          test -x "$app_path/Contents/Resources/bin/ffprobe"
          test -x "$app_path/Contents/Resources/audio-host/darwin-arm64/bandbuddy-audio-host"
          test -f "$app_path/Contents/Resources/worker/guitar_separator_hq/separator.py"
          file "$app_path/Contents/MacOS/BandBuddy" | grep -q "arm64"
          "$app_path/Contents/Resources/bin/uv" --version
          "$app_path/Contents/Resources/bin/ffmpeg" -version
          "$app_path/Contents/Resources/bin/ffprobe" -version
          "$app_path/Contents/Resources/audio-host/darwin-arm64/bandbuddy-audio-host" --self-test

      - name: Generate checksums
        shell: bash
        run: |
          shopt -s nullglob
          files=(release-macos/BandBuddy-*-macos-arm64.dmg release-macos/BandBuddy-*-macos-arm64.zip)
          test "${#files[@]}" -eq 2
          shasum -a 256 "${files[@]}" | sed 's#release-macos/##' > "release-macos/SHA256SUMS-macos-arm64.txt"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: BandBuddy-macos-arm64-${{ github.sha }}
          path: |
            release-macos/BandBuddy-*-macos-arm64.dmg
            release-macos/BandBuddy-*-macos-arm64.zip
            release-macos/SHA256SUMS-macos-arm64.txt
          if-no-files-found: error
          retention-days: 14
